summary:
  en: "PGDay São Paulo is a one-day community event dedicated to PostgreSQL, supported by Timbira (a company that also organizes PGConf.Brasil, the largest national conference of the Brazilian PostgreSQL community, active since at least 2016-2019). The 2026 edition takes place on 17/10 (Saturday, 08:30-18:00) at Oracle Brasil, single-track format, free of charge, with registration closing 15/10 due to the room's capacity limit."
  pt-BR: "PGDay São Paulo é um evento comunitário de um dia dedicado ao PostgreSQL, com apoio da Timbira (empresa que também organiza a PGConf.Brasil, a maior conferência nacional da comunidade PostgreSQL brasileira, ativa desde pelo menos 2016-2019). A edição de 2026 ocorre em 17/10 (sábado, 08:30-18:00) na Oracle Brasil, formato trilha única, gratuito, com inscrições fechando 15/10 por limite de capacidade da sala."
