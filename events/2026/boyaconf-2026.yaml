summary:
  en: "BoyaConf is the technology and software development conference organized by the nonprofit community Boyaca Dev, in Tunja (Colombia) -- the first and only of its kind in the Boyaca region. It has taken place since 2019 and has had multiple editions (2024, 2025, 2026), bringing together devs, enthusiasts and companies from several cities in a single day at the Boyaquira Auditorium. In-person format, programming-language agnostic, focused on sharing knowledge and strengthening the regional tech ecosystem."
  pt-BR: "BoyaConf é a conferência de tecnologia e desenvolvimento de software organizada pela comunidade sem fins lucrativos Boyaca Dev, em Tunja (Colômbia) -- a primeira e única do gênero na região de Boyaca. Ocorre desde 2019 e já teve múltiplas edições (2024, 2025, 2026), reunindo devs, entusiastas e empresas de várias cidades num único dia no Auditório Boyaquira. Formato presencial, agnóstico de linguagem de programação, focado em compartilhar conhecimento e fortalecer o ecossistema tech regional."
