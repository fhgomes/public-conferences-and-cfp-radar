summary:
  en: "Agile Trends is a series of Brazilian conferences on agility, management and innovation, organized by Agile Trends Brasil, with editions ('pockets') in several cities. The main São Paulo edition brings together more than 100 content sessions and gathered about 3,000 attendees and 150 cases from 600 institutions in the 2026 edition (31/08-01/09); for 2027 the organization estimates April, at Parque Ibirapuera/Bienal."
