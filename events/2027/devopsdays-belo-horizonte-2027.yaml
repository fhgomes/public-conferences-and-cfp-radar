summary:
  en: "DevOpsDays Belo Horizonte is the local chapter of DevOpsDays, a global, non-profit community conference format about DevOps/culture/cloud/automation, born in 2009 (Ghent, Belgium) and replicated by volunteers in dozens of cities. 1-day format: short curated talks in the morning and open space sessions (unconference, topics proposed by the audience itself) in the afternoon. The 2027 edition takes place at UniBH Buritis; the page already invites talk proposals, with no published deadline as of the collection date."
  pt-BR: "DevOpsDays Belo Horizonte é o capítulo local do DevOpsDays, formato global de conferência comunitária sobre DevOps/cultura/cloud/automação, sem fins lucrativos, nascido em 2009 (Ghent, Bélgica) e replicado por voluntários em dezenas de cidades. Formato de 1 dia: palestras curtas curadas pela manhã e sessões de open space (unconference, temas propostos pelo próprio público) à tarde. A edição 2027 acontece na UniBH Buritis; a página já convida propostas de palestra, sem prazo (deadline) publicado até a data de coleta."
