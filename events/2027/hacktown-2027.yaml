summary:
  en: "HackTown is a Brazilian festival of technology, innovation, creativity and business held in Santa Rita do Sapucaí (MG), the 'Vale da Eletrônica' of Minas Gerais. The 2026 edition (03-07/09) celebrated 10 years of the festival, bringing together ~15 thousand participants, 500 companies and 100 startups, with executives from Nvidia, Google, Meta, AWS, Microsoft and IBM, across 21 content tracks; the 2027 edition has not yet been announced."
  pt-BR: "HackTown é um festival brasileiro de tecnologia, inovação, criatividade e negócios realizado em Santa Rita do Sapucaí (MG), o 'Vale da Eletrônica' mineiro. A edição 2026 (03-07/09) celebrou 10 anos do festival, reunindo ~15 mil participantes, 500 empresas e 100 startups, com executivos de Nvidia, Google, Meta, AWS, Microsoft e IBM, em 21 trilhas de conteúdo; a de 2027 ainda não foi anunciada."
