  en: "Confitura is the community Java conference of Varsóvia, organized by Warszawa JUG since 2007 -- one of the oldest and most traditional in Polônia. It has gathered around 1,800 people in past editions (2019-2023); in 2025 it had about 450 attendees and 60 speakers over two days, moving from its traditional month of June to September."
