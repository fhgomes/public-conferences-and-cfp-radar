summary:
  en: "Campus Party is a Brazilian festival of technology, innovation, games and geek culture created in the early 2000s, with a multi-day immersive format (stages, e-sports arena, hackathons, camping area). The 18th national edition (CPBR18) was scheduled for June 2026 in BRASÍLIA (Arena BRB Mané Garrincha), but was POSTPONED for reasons beyond the organizers' control and, as of the research (Sep/2026), still had NO new confirmed date."
  pt-BR: "Campus Party é um festival brasileiro de tecnologia, inovação, games e cultura geek criado no início dos anos 2000, com formato de vários dias de imersão (palcos, arena de e-sports, hackathons, acampamento). A 18ª edição nacional (CPBR18) estava marcada para junho de 2026 em BRASÍLIA (Arena BRB Mané Garrincha), mas foi ADIADA por motivos fora do controle da organização e, até a pesquisa (set/2026), seguia SEM nova data confirmada."
