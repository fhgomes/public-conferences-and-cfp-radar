  en: "DevConverge LATAM is a series of developer meetups launched in December 2023 in Buenos Aires by tech communities, now with 'sprints' in several cities across Latin America. The 'Sprint São Paulo' is the São Paulo edition, with simultaneous tracks (Java, Go, Python, PHP, Clojure, Node.js), a mentoring hub and sponsorship from large local companies (e.g. Nubank)."
