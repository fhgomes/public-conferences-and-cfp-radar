summary:
  en: "FOSDEM is the largest and most traditional free software event in Europe, held at ULB in Bruxelas since the 2000s. Two days, dozens of parallel 'devrooms' organized by specific communities -- there is no fixed Java track, it depends on a relevant devroom being approved each year."
  pt-BR: "FOSDEM é o maior e mais tradicional evento gratuito de software livre da Europa, realizado na ULB em Bruxelas desde os anos 2000. Dois dias, dezenas de 'devrooms' paralelos organizados por comunidades específicas -- não há uma trilha Java fixa, depende de haver um devroom relevante aprovado a cada ano."
