name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/selftest.py
      - name: Validate the pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --github-annotations --base origin/${{ github.base_ref }}
      - name: Validate the branch
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate.py --github-annotations
