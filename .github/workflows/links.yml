name: links

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Collect the event and CFP URLs
        run: |
          python3 - <<'PY' > urls.txt
          import glob, yaml
          for path in sorted(glob.glob("events/*/*.yaml")):
              record = yaml.safe_load(open(path, encoding="utf-8"))
              for url in ((record.get("links") or {}).get("website"), (record.get("cfp") or {}).get("url")):
                  if url:
                      print(url)
          PY
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 8 urls.txt
          fail: false
