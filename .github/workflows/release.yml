name: release

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Release the month's snapshot
        run: |
          tag="data-$(date -u +%Y.%m)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag exists, nothing to do"
            exit 0
          fi
          python3 scripts/validate.py
          python3 scripts/build_bundles.py --root . --out _site
          count=$(jq length _site/events.json)
          gh release create "$tag" --title "$tag" --notes "$count events, schema 1" _site/*.json _site/*.jsonl _site/*.ics
